[project]
name = "netagent"
version = "0.1.0"
description = "Evidence-driven AI network engineer and cybersecurity architect agent"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40"]

[project.optional-dependencies]
device = ["netmiko>=4.3"]
dev = ["pytest>=8"]

[project.scripts]
netagent = "netagent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netagent = ["*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
